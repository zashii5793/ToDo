<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoリスト</title>
<style>
  :root{
    --accent:#c8451f;
    --accent-soft:#f7ede9;
    --ink:#1c2733;
    --sub:#5b6b7a;
    --muted:#9aa7b2;
    --line:#e2e8ee;
    --bg:#f4f6f9;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    margin:0;
    padding:28px 16px 64px;
  }
  .wrap{max-width:680px;margin:0 auto;}
  header{margin-bottom:20px;}
  h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  h1::before{content:"";width:6px;height:24px;background:var(--accent);border-radius:3px;}
  .lead{color:var(--sub);font-size:13px;margin:0;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 18px 8px;
    margin:16px 0;
    box-shadow:0 1px 2px rgba(28,39,51,.04);
  }
  h2{
    font-size:16px;
    margin:0 0 12px;
    padding-left:10px;
    border-left:4px solid var(--accent);
  }
  .addrow{display:flex;gap:8px;margin-bottom:12px;}
  .addrow input{
    flex:1;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .addrow input:focus{outline:none;border-color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  .btn-add{
    background:var(--accent);color:#fff;border:none;
    padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;
  }
  .btn-add:hover{background:#a83817;}
  ul.list{list-style:none;margin:0;padding:0;}
  ul.list li{
    display:flex;align-items:center;gap:10px;
    padding:8px 6px;border-bottom:1px dashed var(--line);
  }
  ul.list li:last-child{border-bottom:none;}
  ul.list li.empty{color:var(--muted);justify-content:center;font-size:13px;padding:14px;}
  .chk{width:18px;height:18px;flex:none;cursor:pointer;accent-color:var(--accent);}
  .txt{flex:1;font-size:14.5px;border:none;background:transparent;font-family:inherit;color:var(--ink);padding:2px 0;}
  .txt:focus{outline:none;border-bottom:1px solid var(--accent);}
  li.done .txt{text-decoration:line-through;color:var(--muted);}
  .del{
    background:none;border:none;color:var(--muted);font-size:18px;
    line-height:1;padding:2px 6px;border-radius:6px;flex:none;
  }
  .del:hover{background:var(--accent-soft);color:var(--accent);}
  .actions{
    display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;
  }
  .actions button{
    padding:11px 16px;border-radius:9px;font-size:14px;font-weight:600;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  .actions button:hover{border-color:var(--accent);color:var(--accent);}
  .actions .primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .actions .primary:hover{background:#a83817;color:#fff;}
  .hint{color:var(--sub);font-size:12px;margin-top:14px;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px;}
  footer a{color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ToDoリスト</h1>
    <p class="lead">当日と翌日のやることを整理して、メモ帳に貼れる形で書き出せます。入力内容はこのブラウザに自動保存されます。</p>
  </header>

  <section class="card">
    <h2>当日のToDo</h2>
    <div class="addrow">
      <input type="text" id="input-today" placeholder="やることを入力して Enter または「追加」" autocomplete="off">
      <button class="btn-add" data-add="today">追加</button>
    </div>
    <ul class="list" id="list-today"></ul>
  </section>

  <section class="card">
    <h2>翌日のToDo</h2>
    <div class="addrow">
      <input type="text" id="input-tomorrow" placeholder="やることを入力して Enter または「追加」" autocomplete="off">
      <button class="btn-add" data-add="tomorrow">追加</button>
    </div>
    <ul class="list" id="list-tomorrow"></ul>
  </section>

  <div class="actions">
    <button class="primary" id="export">メモ帳用に書き出す（.txt）</button>
    <button id="carryover">翌日のToDoを当日へ繰り越す</button>
    <button id="clear-done">完了済みを削除</button>
    <button id="clear-all">すべて消去</button>
  </div>
  <p class="hint">「メモ帳用に書き出す」を押すと、Windowsのメモ帳でそのまま開けるテキストファイル（.txt）としてダウンロードされます。ダウンロードしたファイルをメモ帳に添付・保存してご利用ください。</p>

  <footer>ブラウザ内（localStorage）だけで動作します。サーバーには何も送信されません。</footer>
</div>

<script>
(function () {
  "use strict";
  var KEY = "todo-list-v1";
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { today: [], tomorrow: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function render(which) {
    var list = document.getElementById("list-" + which);
    var items = state[which];
    list.innerHTML = "";
    if (!items.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "（記入なし）";
      list.appendChild(li);
      return;
    }
    items.forEach(function (item, idx) {
      var li = document.createElement("li");
      if (item.done) li.className = "done";

      var chk = document.createElement("input");
      chk.type = "checkbox";
      chk.className = "chk";
      chk.checked = !!item.done;
      chk.addEventListener("change", function () {
        item.done = chk.checked; save(); render(which);
      });

      var txt = document.createElement("input");
      txt.type = "text";
      txt.className = "txt";
      txt.value = item.text;
      txt.addEventListener("input", function () { item.text = txt.value; save(); });

      var del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "削除");
      del.textContent = "×";
      del.addEventListener("click", function () {
        state[which].splice(idx, 1); save(); render(which);
      });

      li.appendChild(chk);
      li.appendChild(txt);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  function add(which) {
    var input = document.getElementById("input-" + which);
    var v = input.value.trim();
    if (!v) return;
    state[which].push({ text: v, done: false });
    input.value = "";
    save(); render(which); input.focus();
  }

  // pad helpers
  function p(n) { return (n < 10 ? "0" : "") + n; }
  function stamp(d) {
    return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function sectionText(title, items) {
    var lines = ["【" + title + "】"];
    if (!items.length) {
      lines.push("（記入なし）");
    } else {
      items.forEach(function (item, i) {
        var box = item.done ? "[x]" : "[ ]";
        lines.push((i + 1) + ". " + box + " " + item.text);
      });
    }
    return lines.join("\r\n");
  }

  function buildText() {
    var now = new Date();
    var parts = [
      "■ ToDoリスト",
      "書き出し日時：" + stamp(now),
      "",
      sectionText("当日のToDo", state.today),
      "",
      sectionText("翌日のToDo", state.tomorrow),
      ""
    ];
    return parts.join("\r\n");
  }

  function exportTxt() {
    var text = buildText();
    // UTF-8 BOM を付与して、Windows のメモ帳で文字化けせず開けるようにする
    var bom = "﻿";
    var blob = new Blob([bom + text], { type: "text/plain;charset=utf-8" });
    var now = new Date();
    var fname = "todo_" + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + ".txt";
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // events
  document.querySelectorAll("[data-add]").forEach(function (b) {
    b.addEventListener("click", function () { add(b.getAttribute("data-add")); });
  });
  ["today", "tomorrow"].forEach(function (which) {
    document.getElementById("input-" + which).addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); add(which); }
    });
  });
  document.getElementById("export").addEventListener("click", exportTxt);
  document.getElementById("carryover").addEventListener("click", function () {
    if (!state.tomorrow.length) return;
    if (!confirm("翌日のToDoを当日へ移動します。よろしいですか？")) return;
    state.today = state.today.concat(state.tomorrow);
    state.tomorrow = [];
    save(); render("today"); render("tomorrow");
  });
  document.getElementById("clear-done").addEventListener("click", function () {
    state.today = state.today.filter(function (i) { return !i.done; });
    state.tomorrow = state.tomorrow.filter(function (i) { return !i.done; });
    save(); render("today"); render("tomorrow");
  });
  document.getElementById("clear-all").addEventListener("click", function () {
    if (!confirm("すべてのToDoを消去します。よろしいですか？")) return;
    state = { today: [], tomorrow: [] };
    save(); render("today"); render("tomorrow");
  });

  render("today");
  render("tomorrow");
})();
</script>
</body>
</html>
