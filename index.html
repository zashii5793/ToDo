<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoリスト</title>
<style>
  /* ===== 元の todo.html と同じ文書スタイル（見た目はそのまま） ===== */
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    max-width:640px;margin:32px auto;padding:0 22px;
    color:#1c2733;line-height:1.8;
  }
  h1{font-size:20px;margin:0 0 4px;}
  .stamp{color:#5b6b7a;font-size:12px;margin:0 0 20px;}
  h2{font-size:16px;border-left:4px solid #c8451f;padding-left:10px;margin:26px 0 8px;}
  ol{padding-left:24px;margin:0;}
  li{margin:5px 0;}
  li.done .txt{text-decoration:line-through;color:#9aa7b2;}
  li.none{list-style:none;color:#9aa7b2;}

  /* ===== 操作用に足した要素（普段は目立たせない） ===== */
  li.item .txt{outline:none;}
  li.item .txt:empty::before{content:"やることを入力";color:#b4bec7;}
  .ctl{float:right;white-space:nowrap;margin-left:12px;opacity:.22;transition:opacity .12s;}
  li.item:hover .ctl,.ctl:focus-within{opacity:1;}
  .chk{vertical-align:middle;cursor:pointer;accent-color:#c8451f;}
  .del{
    border:none;background:none;color:#9aa7b2;cursor:pointer;
    font-size:15px;line-height:1;padding:0 2px;margin-left:2px;vertical-align:middle;
  }
  .del:hover{color:#c8451f;}

  .add{
    display:block;margin:6px 0 0 24px;padding:0;
    border:none;background:none;color:#c8451f;cursor:pointer;
    font:inherit;font-size:13px;
  }
  .add:hover{text-decoration:underline;}

  .actions{margin-top:34px;border-top:1px solid #edf1f4;padding-top:18px;
    display:flex;flex-wrap:wrap;gap:10px;}
  .actions button{
    font:inherit;font-size:13px;cursor:pointer;
    border:1px solid #dfe5ea;background:#fff;border-radius:7px;padding:8px 14px;color:#1c2733;
  }
  .actions button:hover{border-color:#c8451f;color:#c8451f;}
  .actions .primary{background:#c8451f;border-color:#c8451f;color:#fff;}
  .actions .primary:hover{background:#a83817;color:#fff;}
  .note{color:#8a97a3;font-size:11.5px;margin-top:14px;line-height:1.7;}
</style>
</head>
<body>
<h1>ToDoリスト</h1>
<p class="stamp" id="stamp"></p>

<section>
  <h2>当日のToDo</h2>
  <ol id="list-today"></ol>
  <button class="add" data-add="today">＋ 項目を追加</button>
</section>

<section>
  <h2>翌日のToDo</h2>
  <ol id="list-tomorrow"></ol>
  <button class="add" data-add="tomorrow">＋ 項目を追加</button>
</section>

<div class="actions">
  <button class="primary" id="export">メモ帳用に書き出す（.txt）</button>
  <button id="carryover">翌日を当日へ繰り越す</button>
  <button id="clear-done">完了済みを削除</button>
  <button id="clear-all">すべて消去</button>
</div>
<p class="note">入力内容はこのブラウザに自動保存されます（サーバーには送信されません）。各項目にマウスを合わせると、完了チェックと削除ボタンが表示されます。「メモ帳用に書き出す」で、メモ帳にそのまま貼れるテキスト（.txt）を保存できます。</p>

<script>
(function () {
  "use strict";
  var KEY = "todo-list-v1";
  var state = load();

  function load() {
    try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
    return { today: [], tomorrow: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); }
  function stampText(d) {
    return ymd(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function render(which) {
    var ol = document.getElementById("list-" + which);
    var items = state[which];
    ol.innerHTML = "";
    if (!items.length) {
      var none = document.createElement("li");
      none.className = "none";
      none.textContent = "（記入なし）";
      ol.appendChild(none);
      return;
    }
    items.forEach(function (item, idx) {
      var li = document.createElement("li");
      li.className = "item" + (item.done ? " done" : "");

      // 操作コントロール（右側・普段は薄い）
      var ctl = document.createElement("span");
      ctl.className = "ctl";
      ctl.setAttribute("contenteditable", "false");

      var chk = document.createElement("input");
      chk.type = "checkbox";
      chk.className = "chk";
      chk.checked = !!item.done;
      chk.title = "完了にする";
      chk.addEventListener("change", function () { item.done = chk.checked; save(); render(which); });

      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.setAttribute("aria-label", "削除");
      del.textContent = "×";
      del.addEventListener("click", function () { state[which].splice(idx, 1); save(); render(which); });

      ctl.appendChild(chk);
      ctl.appendChild(del);

      // 本文（そのまま編集できる）
      var txt = document.createElement("span");
      txt.className = "txt";
      txt.setAttribute("contenteditable", "true");
      txt.textContent = item.text;
      txt.addEventListener("input", function () { item.text = txt.textContent; save(); });
      txt.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); txt.blur(); add(which); }
      });

      li.appendChild(ctl);   // float:right なので先に置く
      li.appendChild(txt);
      ol.appendChild(li);
    });
  }

  function add(which) {
    state[which].push({ text: "", done: false });
    save(); render(which);
    // 追加した末尾項目にフォーカス
    var ol = document.getElementById("list-" + which);
    var last = ol.querySelector("li.item:last-child .txt");
    if (last) {
      last.focus();
      var r = document.createRange(); r.selectNodeContents(last); r.collapse(false);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  }

  function sectionText(title, items) {
    var lines = ["【" + title + "】"];
    var real = items.filter(function (it) { return it.text.trim() !== ""; });
    if (!real.length) { lines.push("（記入なし）"); }
    else {
      real.forEach(function (it, i) {
        lines.push((i + 1) + ". " + (it.done ? "[x]" : "[ ]") + " " + it.text);
      });
    }
    return lines.join("\r\n");
  }

  function exportTxt() {
    var now = new Date();
    var text = [
      "■ ToDoリスト",
      "書き出し日時：" + stampText(now),
      "",
      sectionText("当日のToDo", state.today),
      "",
      sectionText("翌日のToDo", state.tomorrow),
      ""
    ].join("\r\n");
    // UTF-8 BOM を付与し、Windows のメモ帳で文字化けせず開けるようにする
    var blob = new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" });
    var fname = "todo_" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + ".txt";
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  document.querySelectorAll("[data-add]").forEach(function (b) {
    b.addEventListener("click", function () { add(b.getAttribute("data-add")); });
  });
  document.getElementById("export").addEventListener("click", exportTxt);
  document.getElementById("carryover").addEventListener("click", function () {
    if (!state.tomorrow.length) return;
    if (!confirm("翌日のToDoを当日へ移動します。よろしいですか？")) return;
    state.today = state.today.concat(state.tomorrow);
    state.tomorrow = [];
    save(); render("today"); render("tomorrow");
  });
  document.getElementById("clear-done").addEventListener("click", function () {
    state.today = state.today.filter(function (i) { return !i.done; });
    state.tomorrow = state.tomorrow.filter(function (i) { return !i.done; });
    save(); render("today"); render("tomorrow");
  });
  document.getElementById("clear-all").addEventListener("click", function () {
    if (!confirm("すべてのToDoを消去します。よろしいですか？")) return;
    state = { today: [], tomorrow: [] };
    save(); render("today"); render("tomorrow");
  });

  document.getElementById("stamp").textContent = "本日：" + ymd(new Date());
  render("today");
  render("tomorrow");
})();
</script>
</body>
</html>
