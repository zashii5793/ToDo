<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoリスト</title>
<style>
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    max-width:640px;margin:32px auto;padding:0 22px;
    color:#1c2733;line-height:1.8;
  }
  h1{font-size:20px;margin:0 0 4px;}
  .stamp{color:#5b6b7a;font-size:12px;margin:0 0 20px;}
  h2{font-size:16px;border-left:4px solid #c8451f;padding-left:10px;margin:26px 0 8px;}
  ol{padding-left:24px;margin:0;}
  li{margin:5px 0;}
  li.done .txt{text-decoration:line-through;color:#9aa7b2;}
  li.none{list-style:none;color:#9aa7b2;}

  /* --- 操作用に控えめに追加した要素（文書の見た目は変えない） --- */
  li.item{display:flex;align-items:baseline;gap:8px;}
  .chk{flex:none;transform:translateY(1px);accent-color:#c8451f;cursor:pointer;}
  .txt{
    flex:1;border:none;background:transparent;font:inherit;color:inherit;
    line-height:1.8;padding:0;
  }
  .txt:focus{outline:none;border-bottom:1px solid #c8451f;}
  .del{
    flex:none;border:none;background:none;color:#c9d2da;cursor:pointer;
    font-size:15px;line-height:1;padding:0 2px;
  }
  li.item:hover .del{color:#c8451f;}

  .addrow{display:flex;gap:8px;margin:8px 0 0 24px;}
  .addrow input{
    flex:1;font:inherit;color:#1c2733;
    border:none;border-bottom:1px dashed #cdd6de;background:transparent;
    padding:2px 0;
  }
  .addrow input::placeholder{color:#b4bec7;}
  .addrow input:focus{outline:none;border-bottom-color:#c8451f;}
  .addrow button{
    flex:none;font:inherit;font-size:13px;color:#c8451f;cursor:pointer;
    border:1px solid #e2c6bd;background:#fff;border-radius:6px;padding:1px 10px;
  }
  .addrow button:hover{background:#f7ede9;}

  .actions{margin-top:32px;border-top:1px solid #edf1f4;padding-top:18px;
    display:flex;flex-wrap:wrap;gap:10px;}
  .actions button{
    font:inherit;font-size:13px;cursor:pointer;
    border:1px solid #dfe5ea;background:#fff;border-radius:7px;padding:8px 14px;color:#1c2733;
  }
  .actions button:hover{border-color:#c8451f;color:#c8451f;}
  .actions .primary{background:#c8451f;border-color:#c8451f;color:#fff;}
  .actions .primary:hover{background:#a83817;color:#fff;}
  .note{color:#8a97a3;font-size:11.5px;margin-top:14px;line-height:1.7;}
</style>
</head>
<body>
<h1>ToDoリスト</h1>
<p class="stamp" id="stamp"></p>

<section>
  <h2>当日のToDo</h2>
  <ol id="list-today"></ol>
  <div class="addrow">
    <input type="text" id="input-today" placeholder="やることを入力（Enterで追加）" autocomplete="off">
    <button data-add="today">追加</button>
  </div>
</section>

<section>
  <h2>翌日のToDo</h2>
  <ol id="list-tomorrow"></ol>
  <div class="addrow">
    <input type="text" id="input-tomorrow" placeholder="やることを入力（Enterで追加）" autocomplete="off">
    <button data-add="tomorrow">追加</button>
  </div>
</section>

<div class="actions">
  <button class="primary" id="export">メモ帳用に書き出す（.txt）</button>
  <button id="carryover">翌日を当日へ繰り越す</button>
  <button id="clear-done">完了済みを削除</button>
  <button id="clear-all">すべて消去</button>
</div>
<p class="note">入力内容はこのブラウザに自動保存されます（サーバーには送信されません）。「メモ帳用に書き出す」で、メモ帳にそのまま貼れるテキスト（.txt）を保存できます。</p>

<script>
(function () {
  "use strict";
  var KEY = "todo-list-v1";
  var state = load();

  function load() {
    try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
    return { today: [], tomorrow: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function p(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); }
  function stampText(d) {
    return ymd(d) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function render(which) {
    var ol = document.getElementById("list-" + which);
    var items = state[which];
    ol.innerHTML = "";
    if (!items.length) {
      var none = document.createElement("li");
      none.className = "none";
      none.textContent = "（記入なし）";
      ol.appendChild(none);
      return;
    }
    items.forEach(function (item, idx) {
      var li = document.createElement("li");
      li.className = "item" + (item.done ? " done" : "");

      var chk = document.createElement("input");
      chk.type = "checkbox";
      chk.className = "chk";
      chk.checked = !!item.done;
      chk.title = "完了にする";
      chk.addEventListener("change", function () { item.done = chk.checked; save(); render(which); });

      var txt = document.createElement("input");
      txt.type = "text";
      txt.className = "txt";
      txt.value = item.text;
      txt.addEventListener("input", function () { item.text = txt.value; save(); });

      var del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "削除");
      del.textContent = "×";
      del.addEventListener("click", function () { state[which].splice(idx, 1); save(); render(which); });

      li.appendChild(chk);
      li.appendChild(txt);
      li.appendChild(del);
      ol.appendChild(li);
    });
  }

  function add(which) {
    var input = document.getElementById("input-" + which);
    var v = input.value.trim();
    if (!v) return;
    state[which].push({ text: v, done: false });
    input.value = "";
    save(); render(which); input.focus();
  }

  function sectionText(title, items) {
    var lines = ["【" + title + "】"];
    if (!items.length) { lines.push("（記入なし）"); }
    else {
      items.forEach(function (it, i) {
        lines.push((i + 1) + ". " + (it.done ? "[x]" : "[ ]") + " " + it.text);
      });
    }
    return lines.join("\r\n");
  }

  function exportTxt() {
    var now = new Date();
    var text = [
      "■ ToDoリスト",
      "書き出し日時：" + stampText(now),
      "",
      sectionText("当日のToDo", state.today),
      "",
      sectionText("翌日のToDo", state.tomorrow),
      ""
    ].join("\r\n");
    // UTF-8 BOM を付与し、Windows のメモ帳で文字化けせず開けるようにする
    var blob = new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" });
    var fname = "todo_" + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + ".txt";
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  document.querySelectorAll("[data-add]").forEach(function (b) {
    b.addEventListener("click", function () { add(b.getAttribute("data-add")); });
  });
  ["today", "tomorrow"].forEach(function (which) {
    document.getElementById("input-" + which).addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); add(which); }
    });
  });
  document.getElementById("export").addEventListener("click", exportTxt);
  document.getElementById("carryover").addEventListener("click", function () {
    if (!state.tomorrow.length) return;
    if (!confirm("翌日のToDoを当日へ移動します。よろしいですか？")) return;
    state.today = state.today.concat(state.tomorrow);
    state.tomorrow = [];
    save(); render("today"); render("tomorrow");
  });
  document.getElementById("clear-done").addEventListener("click", function () {
    state.today = state.today.filter(function (i) { return !i.done; });
    state.tomorrow = state.tomorrow.filter(function (i) { return !i.done; });
    save(); render("today"); render("tomorrow");
  });
  document.getElementById("clear-all").addEventListener("click", function () {
    if (!confirm("すべてのToDoを消去します。よろしいですか？")) return;
    state = { today: [], tomorrow: [] };
    save(); render("today"); render("tomorrow");
  });

  document.getElementById("stamp").textContent = "本日：" + ymd(new Date());
  render("today");
  render("tomorrow");
})();
</script>
</body>
</html>
